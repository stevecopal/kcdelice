{% extends "espace/base.html" %}
{% load i18n %}

{% block title %}{{ page_title }}{% endblock %}

{% block content %}
  <div class="mb-6">
    <h2 class="text-2xl font-bold sm:text-3xl">{{ page_title }}</h2>
  </div>

  <div class="rounded-2xl border border-dashed border-noir/20 bg-blanc px-6 py-16 text-center">
    <span class="mx-auto flex h-14 w-14 items-center justify-center rounded-full bg-noir/5 text-noir/50" aria-hidden="true">
      <svg class="h-7 w-7" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="10" /><line x1="12" x2="12" y1="8" y2="12" /><line x1="12" x2="12.01" y1="16" y2="16" />
      </svg>
    </span>
    <p class="mt-4 text-base text-noir/60">{{ placeholder_text }}</p>
  </div>
{% endblock %}
