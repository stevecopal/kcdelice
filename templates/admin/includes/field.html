<div class="mb-5">
  {% if field.field.widget.input_type == "checkbox" %}
    <div class="flex items-center gap-3">
      {{ field }}
      <label for="{{ field.id_for_label }}" class="text-sm font-medium text-noir">{{ field.label|capfirst }}</label>
    </div>
  {% else %}
    <label for="{{ field.id_for_label }}" class="mb-1.5 block text-sm font-semibold text-noir">
      {{ field.label|capfirst }}{% if field.field.required %} <span class="text-vert">*</span>{% endif %}
    </label>
    {{ field }}
    {% if field.help_text %}
      <p class="mt-1.5 text-sm text-noir/60">{{ field.help_text }}</p>
    {% endif %}
  {% endif %}
  {% if field.errors %}
    <div class="mt-2 rounded-xl bg-noir/5 px-4 py-3 text-sm font-medium text-noir">
      {% for error in field.errors %}<p>{{ error }}</p>{% endfor %}
    </div>
  {% endif %}
</div>
