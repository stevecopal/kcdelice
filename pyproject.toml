[project]
name = "kcdelice"
version = "0.1.0"
description = "Application web de l'entreprise événementielle KCDélices : site public, administration et gestion des devis."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "django>=6.1.3,<6.2",
    "gunicorn>=27.0.1",
    "pillow>=13.0.0",
    "psycopg[binary]>=3.3.9",
    "python-decouple>=3.8",
    "weasyprint>=70.0",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
    "pytest-django>=4.14.0",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
python_files = ["tests.py", "test_*.py", "*_tests.py"]
testpaths = ["core/tests", "devis/tests"]
addopts = "-ra --strict-markers"

[tool.coverage.run]
source = ["core", "devis"]
omit = ["*/migrations/*", "*/tests/*"]
